<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FARNAJ Menu</title>

    <link rel="stylesheet" href="css/menu.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header class="menu-header">

        <a href="index.html" class="back-btn">
            ← Home
        </a>

        <div>

            <h1>FARNAJ MENU</h1>

            <p>
                Authentic Pakistani & Fusion Flavors
            </p>

        </div>

    </header>

    <!-- SEARCH -->

    <section class="search-section">

        <input
        type="text"
        id="searchInput"
        placeholder="Search dishes...">

    </section>

    <!-- CATEGORY FILTERS -->

    <section class="categories">

        <button onclick="filterCategory('All')">
            All
        </button>

        <button onclick="filterCategory('Continental Fusion')">
            Continental Fusion
        </button>

        <button onclick="filterCategory('Dhaba Burger Bites')">
            Dhaba Burgers
        </button>

        <button onclick="filterCategory('Restaurant Menu')">
            Restaurant
        </button>

        <button onclick="filterCategory('Dhaba Menu')">
            Dhaba Menu
        </button>

        <button onclick="filterCategory('Beverages')">
            Beverages
        </button>

        <button onclick="filterCategory('Premium Burgers')">
            Burgers
        </button>

        <button onclick="filterCategory('Biryani & Pulao')">
            Biryani
        </button>

    </section>

    <!-- MENU ITEMS -->

    <section id="menuContainer"></section>

    <!-- FLOATING CART -->

    <button
    class="cart-floating"
    onclick="toggleCart()">

        <i class="fa-solid fa-cart-shopping"></i>

        Cart

        <span id="cartCount">
            0
        </span>

    </button>

    <!-- CART DRAWER -->

    <div id="cartDrawer">

        <div class="cart-header">

            <h2>
                Your Cart
            </h2>

            <button onclick="toggleCart()">
                ✕
            </button>

        </div>

        <div id="cartItems"></div>

        <div class="cart-footer">

            <input
            type="text"
            id="customerName"
            placeholder="Your Name"
            required>

            <input
            type="text"
            id="customerPhone"
            placeholder="Phone Number"
            required>

            <input
            type="text"
            id="customerAddress"
            placeholder="Delivery Address"
            required>

            <h3>

                Total:
                PKR <span id="cartTotal">0</span>

            </h3>

            <button
            class="checkout-btn"
            onclick="checkoutOrder()">

                Place Order

            </button>

        </div>

    </div>

    <!-- OVERLAY -->

    <div
    id="overlay"
    onclick="toggleCart()">
    </div>

    <!-- SUCCESS POPUP -->

    <div
    id="successPopup"
    class="success-popup">

        <div class="popup-box">

            <i class="fa-solid fa-circle-check"></i>

            <h2>
                Order Confirmed
            </h2>

            <p>

                Thank you for choosing FARNAJ Cuisine.

                Your order has been received successfully.

            </p>

            <button onclick="closePopup()">

                Continue

            </button>

        </div>

    </div>

    <!-- SCRIPTS -->

    <script src="data/menu-data.js"></script>

    <script
    type="module"
    src="js/menu.js">
    </script>

</body>

</html>
