<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>DEESU Admin Panel</title>

<style>

body{
    font-family:Poppins,sans-serif;
    background:#f4f4f4;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.order-card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.pending{
    color:red;
    font-weight:bold;
}

.completed{
    color:green;
    font-weight:bold;
}

.action-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    padding:10px 15px;
    border:none;
    background:#d4af37;
    cursor:pointer;
    border-radius:8px;
}

.delete-btn{
    background:#dc3545;
    color:white;
}

.logout-wrapper{
    text-align:center;
    margin-top:50px;
}

.logout-btn{
    background:#dc3545;
    color:white;
    padding:12px 30px;
    font-size:16px;
}

</style>

</head>

<body>

<h1>DEESU Restaurant Orders</h1>

<div id="ordersContainer"></div>

<div class="logout-wrapper">

    <button
    class="logout-btn"
    onclick="logout()">

        Logout

    </button>

</div>

<script
type="module"
src="js/admin.js">
</script>

</body>

</html>
