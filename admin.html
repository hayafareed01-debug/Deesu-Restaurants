<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FARNAJ Admin Panel</title>

<style>

body{
    font-family:Poppins,sans-serif;
    background:#f4f4f4;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.order-card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.order-card ul{
    margin-top:10px;
    margin-left:20px;
}

.pending{
    color:red;
    font-weight:bold;
}

.completed{
    color:green;
    font-weight:bold;
}

button{
    padding:10px 15px;
    border:none;
    background:#d4af37;
    cursor:pointer;
    border-radius:8px;
}

</style>

</head>
<body>

<h1>FARNAJ Orders</h1>
<button onclick="logout()">

Logout

</button>
<div id="ordersContainer"></div>

<script type="module" src="js/admin.js"></script>

</body>
</html>
